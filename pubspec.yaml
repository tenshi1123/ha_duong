  flutter_bloc: ^8.1.6
  persistent_bottom_nav_bar_v2: ^5.3.1
  smooth_page_indicator: ^1.2.0+3
  table_calendar: ^3.1.3
  flick_video_player: ^0.9.0
  visibility_detector: ^0.4.0+2
  flutter_svg: ^2.0.10+1
  firebase_auth: ^5.4.0
  camera_camera: ^3.0.0
  image_picker: ^1.1.2
  flutter_widget_from_html: ^0.15.3
  firebase_core: ^3.9.0
  shared_preferences: ^2.3.5
  widgets_easier: ^0.0.10
  dio: ^5.8.0+1
  flutter_dash: ^1.0.0
  flutter_html: ^3.0.0
  flutter_localizations:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
