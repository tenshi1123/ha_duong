name: ha_duong
description: "ha_duong App"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.2.5+1

environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  intl: any
  flutter_screenutil: ^5.9.3
  url_launcher: ^6.3.0
  otp_pin_field: ^1.4.0
  onesignal_flutter: ^5.3.0
  flutter_html_table: ^3.0.0
  provider: ^6.1.2
  flutter_bloc: ^9.1.1
  persistent_bottom_nav_bar_v2: ^6.1.0
  smooth_page_indicator: ^1.2.0+3
  table_calendar: ^3.1.3
  flick_video_player: ^0.9.0
  visibility_detector: ^0.4.0+2
  flutter_svg: ^2.0.10+1
  firebase_auth: ^6.0.0
  camera_camera: ^3.0.0
  image_picker: ^1.1.2
  flutter_widget_from_html: ^0.17.0
  firebase_core: ^4.0.0
  shared_preferences: ^2.3.5
  widgets_easier: ^0.0.10
  dio: ^5.8.0+1
  flutter_dash: ^1.0.0
  flutter_html: ^3.0.0
  flutter_localizations:
    sdk: flutter
  permission_handler: ^12.0.0+1
  screenshot: ^3.0.0
  gal: ^2.3.1
  webview_flutter: ^4.13.0
  photo_view: ^0.15.0
  local_auth: ^2.3.0
  flutter_secure_storage: ^10.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  font_awesome_flutter: 10.9.1
  camera_camera:
    path: packages/camera_camera

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/icons/
